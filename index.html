<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Les animaux et leurs cris</title>
<style>
  :root {
    color-scheme: light;
  }
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: linear-gradient(160deg, #fff6d8, #cdeffd);
    font-family: "Comic Sans MS", "Trebuchet MS", Verdana, sans-serif;
    touch-action: manipulation;
  }

  #stage {
    position: relative;
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 3vmin;
    padding: 3vmin;
  }

  .animal {
    border: none;
    border-radius: 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: min(14vw, 14vh);
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 8px 0 rgba(0,0,0,0.15), 0 12px 20px rgba(0,0,0,0.15);
    transition: transform 0.08s ease-out;
    position: relative;
    overflow: hidden;
  }

  .animal:active {
    transform: scale(0.94);
  }

  .animal.pop {
    animation: pop 0.6s ease;
  }

  @keyframes pop {
    0%   { transform: scale(1); }
    25%  { transform: scale(1.25) rotate(-4deg); }
    50%  { transform: scale(1.1) rotate(4deg); }
    75%  { transform: scale(1.2) rotate(-2deg); }
    100% { transform: scale(1); }
  }

  .label {
    font-size: min(4.5vw, 4.5vh);
    font-weight: bold;
    color: rgba(0,0,0,0.55);
    margin-top: 1vmin;
  }

  /* Couleurs pastel gaies pour chaque animal */
  .c1 { background: #ffd166; }
  .c2 { background: #ef8b8b; }
  .c3 { background: #8ecae6; }
  .c4 { background: #a3d9a5; }
  .c5 { background: #cdb4db; }
  .c6 { background: #ffb4a2; }

  #sparkle-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
  }

  .sparkle {
    position: absolute;
    font-size: 3rem;
    animation: floatUp 1s ease-out forwards;
  }

  @keyframes floatUp {
    0%   { transform: translateY(0) scale(0.5); opacity: 1; }
    100% { transform: translateY(-120px) scale(1.3); opacity: 0; }
  }

  #hint {
    position: fixed;
    bottom: 1vh;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 2.2vh;
    color: rgba(0,0,0,0.35);
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="stage"></div>
<div id="sparkle-layer"></div>
<div id="hint">Touche un animal pour l'entendre 🐾</div>

<script>
  // Chaque animal : emoji, nom affiché, texte du cri (parlé), couleur
  const animals = [
    { emoji: "🐄", name: "La vache",   sound: "Meuh, meuh !",   color: "c1" },
    { emoji: "🐱", name: "Le chat",    sound: "Miaou, miaou !", color: "c2" },
    { emoji: "🐶", name: "Le chien",   sound: "Ouaf, ouaf !",   color: "c3" },
    { emoji: "🦆", name: "Le canard",  sound: "Coin, coin !",   color: "c4" },
    { emoji: "🐑", name: "Le mouton",  sound: "Bêê, bêê !",     color: "c5" },
    { emoji: "🐷", name: "Le cochon",  sound: "Groin, groin !", color: "c6" },
  ];

  const stage = document.getElementById("stage");
  const sparkleLayer = document.getElementById("sparkle-layer");

  animals.forEach((animal, i) => {
    const btn = document.createElement("button");
    btn.className = "animal " + animal.color;
    btn.innerHTML = `<span class="emoji">${animal.emoji}</span><span class="label">${animal.name}</span>`;
    btn.addEventListener("click", () => playAnimal(btn, animal));
    stage.appendChild(btn);
  });

  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    return audioCtx;
  }

  // Petit "boing" joyeux joué avant le cri, pour capter l'attention du bébé
  function playBoing() {
    try {
      const ctx = getAudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(440, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
      osc.connect(gain).connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.2);
    } catch (e) { /* audio non disponible, on ignore */ }
  }

  function speak(text, rate) {
    if (!("speechSynthesis" in window)) return;
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = "fr-FR";
    utter.rate = rate || 0.9;
    utter.pitch = 1.3;
    const voices = window.speechSynthesis.getVoices();
    const frVoice = voices.find(v => v.lang && v.lang.startsWith("fr"));
    if (frVoice) utter.voice = frVoice;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utter);
  }

  function spawnSparkles(rect) {
    const symbols = ["⭐", "✨", "🎉", "💫"];
    for (let i = 0; i < 6; i++) {
      const el = document.createElement("div");
      el.className = "sparkle";
      el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
      const x = rect.left + rect.width / 2 + (Math.random() - 0.5) * rect.width * 0.6;
      const y = rect.top + rect.height / 2 + (Math.random() - 0.5) * rect.height * 0.6;
      el.style.left = x + "px";
      el.style.top = y + "px";
      sparkleLayer.appendChild(el);
      setTimeout(() => el.remove(), 1000);
    }
  }

  function playAnimal(btn, animal) {
    btn.classList.remove("pop");
    void btn.offsetWidth; // relance l'animation
    btn.classList.add("pop");

    spawnSparkles(btn.getBoundingClientRect());
    playBoing();

    // On dit d'abord le cri (plus expressif), puis le nom de l'animal
    setTimeout(() => speak(animal.sound, 0.85), 150);
    setTimeout(() => speak(animal.name, 0.8), 1400);
  }

  // Certains navigateurs chargent les voix de façon asynchrone
  if ("speechSynthesis" in window) {
    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
  }
</script>

</body>
</html>
